name: CI

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
    branches: [main]

jobs:

  # ---------------------------------------------------------------------------
  # security-audit — composer audit per CVE critiche nelle dipendenze
  #
  # Gira PRIMA dei test: se una dipendenza ha una CVE critica non ha senso
  # eseguire la suite. Il job fallisce se trova pacchetti con advisory di
  # severità >= high (ignorando advisory informativi senza fix disponibile).
  # ---------------------------------------------------------------------------
  security-audit:
    name: "Security Audit (composer)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies for known vulnerabilities
        # --abandoned: segnala pacchetti abbandonati come warning (non fallisce)
        # --format=table: output leggibile nei log CI
        run: composer audit --abandoned=ignore --format=table

  # ---------------------------------------------------------------------------
  # tests — esegue la suite Pest su PostgreSQL
  #
  # Usiamo PostgreSQL come database di test perché è il database di produzione.
  # SQLite nasconderebbe bug cross-driver (IF NOT EXISTS, FOR UPDATE con COUNT, ecc.)
  # che sono già stati incontrati in questa codebase.
  # ---------------------------------------------------------------------------
  tests:
    name: "Tests (PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }})"
    runs-on: ubuntu-latest
    needs: security-audit

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12.*", "13.*"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: saas_core_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none  # coverage solo su job dedicato per non rallentare la suite

      - name: Install Laravel ${{ matrix.laravel }}
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" \
            --no-interaction --no-update
          composer update --no-interaction --prefer-dist --no-progress

      - name: Copy test environment
        run: cp .env.testing.example .env.testing 2>/dev/null || true

      - name: Run test suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: saas_core_test
          DB_USERNAME: postgres
          DB_PASSWORD: secret
          APP_KEY: base64:2fl+Ktvkfl+Ktvkfl+Ktvkfl+Ktvkfl+Ktvkfl+Ktvkfl4=
        run: ./vendor/bin/pest --ci --colors=never

  # ---------------------------------------------------------------------------
  # static-analysis — PHPStan livello 6 (opzionale, non blocca merge)
  #
  # Aggiunto come job separato per avere feedback rapido senza bloccare il deploy.
  # Quando il livello 6 sarà stabile, alzare a 8 e rimuovere continue-on-error.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: "Static Analysis (PHPStan)"
    runs-on: ubuntu-latest
    continue-on-error: true  # non blocca il merge finché non si alza il livello

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: |
          # Installa PHPStan se non è già in require-dev
          ./vendor/bin/phpstan analyse src --level=6 \
            --error-format=github \
            --no-progress \
          || true
